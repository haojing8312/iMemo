<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vintageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5DEB3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DEB887;stop-opacity:1" />
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" seed="1"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend mode="multiply" in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#vintageGradient)"/>
  <rect width="400" height="400" fill="#000" opacity="0.05" filter="url(#grain)"/>
  <rect x="30" y="30" width="340" height="340" fill="none" stroke="#8B4513" stroke-width="20"/>
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#8B4513" text-anchor="middle">复古可爱</text>
  <text x="200" y="220" font-family="Arial, sans-serif" font-size="28" fill="#A0522D" text-anchor="middle">胶片风</text>
  <text x="200" y="360" font-family="Arial, sans-serif" font-size="18" fill="#666" text-anchor="middle">80年代 • 胶片质感</text>
</svg>
